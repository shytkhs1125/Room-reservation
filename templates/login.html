<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>ログイン</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">
{% with messages = get_flashed_messages() %}

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-warning">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

{% endwith %}
    <h3 class="mb-4">
        ログイン
    </h3>

    <form method="post">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">
                メールアドレス
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                パスワード
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>
        </div>

        <button
            class="btn btn-primary w-100 mb-3">

            ログイン

        </button>

    </form>

    <a href="{{ url_for('register') }}">
        新規利用登録はこちら
    </a>

</div>

</body>
</html>
