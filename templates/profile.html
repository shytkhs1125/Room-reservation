<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>プロフィール</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-info">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <h3 class="mb-4">
        プロフィール
    </h3>


    <form method="post">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}">


        <div class="mb-3">

            <label class="form-label">
                氏名
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ current_user.name }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                メールアドレス
            </label>

            <input
                type="email"
                class="form-control"
                value="{{ current_user.email }}"
                disabled>

            <div class="form-text">
                メールアドレスは現在変更できません。
            </div>

        </div>


        <button
            type="submit"
            class="btn btn-primary w-100">

            氏名を変更する

        </button>

    </form>


    <a
        href="{{ url_for('index') }}"
        class="btn btn-link mt-3">

        トップへ戻る

    </a>

</div>

</body>
</html>
