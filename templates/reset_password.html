<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>新しいパスワードの設定</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>


<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        新しいパスワードの設定
                    </h3>


                    {% with messages = get_flashed_messages() %}

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-info">
                                    {{ message }}
                                </div>

                            {% endfor %}

                        {% endif %}

                    {% endwith %}


                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}">


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label">

                                新しいパスワード

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                required>

                        </div>


                        <div class="mb-3">

                            <label
                                for="password_confirm"
                                class="form-label">

                                新しいパスワード（確認）

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password_confirm"
                                name="password_confirm"
                                required>

                        </div>


                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                パスワードを変更

                            </button>

                        </div>

                    </form>


                    <div class="mt-3 text-center">

                        <a href="{{ url_for('login') }}">
                            ログイン画面に戻る
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
