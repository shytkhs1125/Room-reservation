<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>新規利用登録</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-4">

    <h3 class="mb-4">
        新規利用登録
    </h3>

    <form method="post">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}">
            
        <div class="mb-3">
            <label class="form-label">
                氏名
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                メールアドレス
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                パスワード
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                required>
        </div>

        <button
            class="btn btn-primary w-100">

            利用登録

        </button>

    </form>

</div>

</body>
</html>
